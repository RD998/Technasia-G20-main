<!DOCTYPE html>

<head>

    <title>Document</title>
    <style>
        body {
            opacity: 0;
            animation: fade-out 2s forwards;

        }

        @keyframes fade-out {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        #preloader {
            background: url(assets/preloder.gif) no-repeat center;
            height: 100vh;
            width: 100%;
            position: fixed;
            z-index: 100;
        }
    </style>
</head>

    </div>
</body>
